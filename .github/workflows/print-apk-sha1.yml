name: Print APK SHA-1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sha1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print APK signing certificates with apksigner
        run: |
          ls -l public/app/automateiq-app.apk
          ls "$ANDROID_HOME/build-tools"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -n 1)
          echo "apksigner=$APKSIGNER"
          "$APKSIGNER" verify --print-certs public/app/automateiq-app.apk
