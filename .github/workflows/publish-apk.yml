name: Publish APK to public/app
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: automateiq-app-debug
          run-id: 41340735203
          github-token: ${{ github.token }}
          path: artifact
      - name: Copy APK to public/app and show signing SHA-1
        run: |
          ls -R artifact
          APK=$(find artifact -name "*.apk" | head -n 1)
          echo "APK=$APK"
          mkdir -p public/app
          cp "$APK" public/app/automateiq-app.apk
          ls -l public/app/automateiq-app.apk
          keytool -printcert -jarfile public/app/automateiq-app.apk
      - name: Commit published APK
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/app/automateiq-app.apk
          git commit -m "AutoMateIQ Android v8.0: publish built APK to public/app"
          git push
