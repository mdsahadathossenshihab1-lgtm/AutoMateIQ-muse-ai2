name: Publish APK to public/app
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-apk.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: automateiq-app-debug
          path: apk
          run-id: '41320417407'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish APK
        run: |
          ls -l apk
          cp apk/app-debug.apk public/app/automateiq-app.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/app/automateiq-app.apk
          git commit -m "Update AutoMateIQ APK to native v3.0 (GitHub Actions Gradle build)" || echo "no changes"
          git push
