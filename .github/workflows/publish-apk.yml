name: Publish APK to public/app
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-apk.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: automateiq-app-debug
          path: apk
          run-id: '41332917675'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify APK
        run: |
          ls -lh apk/app-debug.apk
          file apk/app-debug.apk
          keytool -printcert -jarfile apk/app-debug.apk || true
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt 2>/dev/null | head -n1)
          if [ -n "$AAPT" ]; then "$AAPT" dump badging apk/app-debug.apk | grep -E "package:"; fi
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | head -n1)
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs apk/app-debug.apk; fi
      - name: Publish APK
        run: |
          ls -l apk
          cp apk/app-debug.apk public/app/automateiq-app.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/app/automateiq-app.apk
          git commit -m "Update AutoMateIQ APK to native v6.0 (GitHub Actions Gradle build)" || echo "no changes"
          git push
