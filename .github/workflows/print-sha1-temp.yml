name: Print APK SHA-1 (temporary)

on:
  workflow_dispatch:

jobs:
  print-sha1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ls -l public/app/automateiq-app.apk
          APKSIGNER=$(find "$ANDROID_HOME"/build-tools -name apksigner | head -n 1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs public/app/automateiq-app.apk
