name: Publish APK (temporary)

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: automateiq-app-debug
          path: artifact
          run-id: 41381176315
          github-token: ${{ github.token }}
      - run: |
          mkdir -p public/app
          cp artifact/app-debug.apk public/app/automateiq-app.apk
          ls -l public/app/automateiq-app.apk
          git config user.name "AutoMateIQ Publisher"
          git config user.email "publisher@automateiq.local"
          git add public/app/automateiq-app.apk
          git commit -m "AutoMateIQ v8.2: publish built APK to website download" || exit 0
          git push
