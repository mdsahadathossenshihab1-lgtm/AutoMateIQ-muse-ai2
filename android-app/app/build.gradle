plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.automateiq.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.automateiq.app"
        minSdk 24
        targetSdk 34
        versionCode 14
        versionName "8.2"
    }

    buildTypes {
        // v5 SIZE: GitHub Actions builds assembleDebug, so THIS block is
        // what shrinks the shipped APK. R8 minify + shrinkResources strip
        // unused Firebase/Play-services code and resources. firebase-auth,
        // firebase-firestore and play-services-auth are NOT removed —
        // proguard-rules.pro keeps them explicitly, so login + live leads
        // keep working. Real size is measured by the Actions build; no
        // size is claimed from local files here.
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Firebase — SAME project as the website. The project/database are
    // selected in code (FirebaseAuthHelper.DATABASE_ID), never by a secret
    // in the app. google-services.json (real file, from Firebase Console)
    // must sit in app/ at build time; without it the login button shows
    // the in-app "Firebase setup pending" message and never falls back
    // to a website redirect.
    implementation 'com.google.firebase:firebase-auth:23.0.0'
    implementation 'com.google.firebase:firebase-firestore:25.1.0'
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
    // v8.2 closed-app: FCM receiver (ready, sender NOT wired yet) +
    // WorkManager periodic check (the actual closed-app delivery).
    // Versions pinned to releases that exist on Google Maven and fit
    // the auth 23 / firestore 25 era (no BoM switch, to avoid
    // re-resolving the already-verified v8.1 set).
    implementation 'com.google.firebase:firebase-messaging:24.0.2'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'com.google.guava:guava:31.1-android'
}
